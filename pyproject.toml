[project]
name = "taxi-lab"
version = "0.1.0"
description = "K6 SQL Server load testing against the NYC TLC taxi data set, built on taxi-seed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # >=0.2.0 is a hard floor, not a preference. 0.1.0 shipped its own
    # k6_loadtest package, which installs into site-packages as a real directory
    # and shadows this repo's k6_loadtest -- taxi-lab's code then silently never
    # runs. 0.2.0 dropped it.
    #
    # k6_loadtest uses taxi_shared.type_mapping and taxi_shared.sql_generator,
    # which are pure functions: no database, no DuckDB extension, no CLI. That
    # is the whole of this repo's dependency on taxi-seed.
    "taxi-seed>=0.2.0",
    # NOT pinned, and that is a change. It used to be `duckdb==1.4.4`, because
    # taxi-seed's loader asserted one specific build of the community `mssql`
    # extension and the registry serves a build per DuckDB version. That pin is
    # now actively wrong: taxi-seed pins duckdb itself and vendors the
    # extension, so `taxi-seed` plus `duckdb==1.4.4` is unsatisfiable. This
    # repo only reads parquet with DuckDB and never loads the mssql extension,
    # so let taxi-seed's own pin govern the version.
    "duckdb>=1.4.4",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/andrekamman/taxi-lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "k6-loadtest/src/k6_loadtest",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]


[project.scripts]
k6-preprocess = "k6_loadtest.preprocess:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -m "not integration" and no marker any more: the only test that needed Docker was
# the seeder's Compose end-to-end, which moved to taxi-seed with the code. Every test
# here is fast, offline, and runs by default. Re-add both if that stops being true.
addopts = "--import-mode=importlib"
