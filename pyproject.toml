[project]
name = "taxi-lab"
version = "0.1.0"
description = "Recipes for working with the NYC TLC taxi data set, built on taxi-seed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # >=0.2.0 is a hard floor, not a preference. 0.1.0 shipped its own
    # k6_loadtest package, which installs into site-packages as a real directory
    # and shadows this repo's k6_loadtest -- taxi-lab's code then silently never
    # runs. 0.2.0 dropped it, and is also the first release whose generated DDL
    # is page-compressed, which the seeder depends on.
    "taxi-seed>=0.2.0",
    # Pinned exactly, and not by preference. taxi-seed's loader asserts the
    # DuckDB community `mssql` extension is commit 7e57d24, and the registry
    # serves a build per DuckDB version: 1.4.4 -> 7e57d24, 1.5.5 -> 39e547c.
    # A floating `duckdb>=1.4.4` therefore resolves to 1.5.5 in a fresh install,
    # gets the newer extension, and taxi-seed refuses to load with
    # "mssql extension version '39e547c' != expected '7e57d24'". The two
    # versions move together; do not relax this without re-spiking the pair.
    "duckdb==1.4.4",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/andrekamman/taxi-lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "k6-loadtest/src/k6_loadtest",
  "seeder/src/taxi_seeder",
]

# seeder/sql/ lives outside src/, so without this the wheel omits it and the
# container resolves taxi_seeder.ola.VENDORED_SCRIPT to a path that doesn't
# exist -- a failure no unit test catches, since the tests inject script=.
[tool.hatch.build.targets.wheel.force-include]
"seeder/sql" = "taxi_seeder/sql"

[project.optional-dependencies]
test = ["pytest>=8.0"]


[project.scripts]
k6-preprocess = "k6_loadtest.preprocess:main"
taxi-seeder = "taxi_seeder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m \"not integration\""
markers = [
    "integration: needs Docker and a real SQL Server; deselect with -m 'not integration'",
]
