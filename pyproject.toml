[project]
name = "taxi-lab"
version = "0.1.0"
description = "Recipes for working with the NYC TLC taxi data set, built on taxi-seed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "taxi-seed",
    "duckdb>=1.4.4",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/andrekamman/taxi-lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "k6-loadtest/src/k6_loadtest",
  "seeder/src/taxi_seeder",
]

# seeder/sql/ lives outside src/, so without this the wheel omits it and the
# container resolves taxi_seeder.ola.VENDORED_SCRIPT to a path that doesn't
# exist -- a failure no unit test catches, since the tests inject script=.
[tool.hatch.build.targets.wheel.force-include]
"seeder/sql" = "taxi_seeder/sql"

[project.optional-dependencies]
test = ["pytest>=8.0"]

# taxi-seed v0.1.0 (the only release on PyPI) predates the k6 removal and still
# ships a k6_loadtest package. Installed from PyPI it lands in site-packages as a
# real directory and SHADOWS this repo's own k6_loadtest, so taxi-lab's code
# silently never runs. Until a taxi-seed release drops it, resolve taxi-seed from
# the sibling checkout. Replace with a plain version pin once that release exists.
[tool.uv.sources]
taxi-seed = { path = "../taxi-seed", editable = true }

[project.scripts]
k6-preprocess = "k6_loadtest.preprocess:main"
taxi-seeder = "taxi_seeder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
